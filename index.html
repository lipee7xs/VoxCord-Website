<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03030a">
  <meta name="description" content="VoxCord — Fale. Conecte. Viva o VoxCord.">
  <title>VoxCord — Fale. Conecte. Viva o VoxCord.</title>

  <style>
    :root{
      --bg:#03030a;
      --panel:#080914;
      --panel2:#0b0c18;
      --text:#f7f7ff;
      --muted:#a5a7ba;
      --line:rgba(150,130,255,.18);
      --purple:#9a38ff;
      --blue:#147bff;
      --cyan:#00c9ff;
      --pink:#d12cff;
      --shadow:0 0 45px rgba(115,43,255,.22);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,
      BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:
        radial-gradient(circle at 18% 18%,rgba(72,24,170,.12),transparent 28%),
        radial-gradient(circle at 82% 30%,rgba(0,112,255,.08),transparent 26%),
        var(--bg);
      color:var(--text);
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
      background-size:70px 70px;
      mask-image:linear-gradient(to bottom,black,transparent 70%);
      opacity:.25;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button{
      font-family:inherit;
    }

    .container{
      width:min(1180px,calc(100% - 44px));
      margin:auto;
    }

    /* NAVBAR */

    .topbar{
      position:sticky;
      top:0;
      z-index:50;
      height:76px;
      background:rgba(3,3,10,.76);
      backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(160,140,255,.12);
    }

    .nav{
      height:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:30px;
    }

    .brand img{
      width:166px;
      height:52px;
      object-fit:contain;
      display:block;
    }

    .links{
      display:flex;
      align-items:center;
      gap:30px;
      font-size:14px;
      color:#ddd;
    }

    .links a{
      position:relative;
      padding:28px 0;
    }

    .links a::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:15px;
      height:2px;
      border-radius:99px;
      background:linear-gradient(90deg,var(--pink),var(--blue));
      transform:scaleX(0);
      transition:.25s;
    }

    .links a:hover::after,
    .links a.active::after{
      transform:scaleX(1);
    }

    .header-btn,
    .primary{
      border:1px solid rgba(255,255,255,.15);
      background:linear-gradient(135deg,#9b25ff,#146dff);
      box-shadow:0 0 24px rgba(107,44,255,.38);
      color:#fff;
      font-weight:750;
      border-radius:10px;
      padding:12px 18px;
      cursor:pointer;
      transition:.2s;
      white-space:nowrap;
    }

    .header-btn:hover,
    .primary:hover{
      transform:translateY(-2px);
      box-shadow:0 0 35px rgba(115,53,255,.55);
    }

    .menu{
      display:none;
      background:none;
      border:0;
      color:#fff;
      font-size:27px;
      cursor:pointer;
    }

    /* GERAL */

    section{
      border-bottom:1px solid rgba(150,130,255,.1);
    }

    /* HERO */

    .hero{
      min-height:590px;
      display:flex;
      align-items:center;
      position:relative;
    }

    .hero::after{
      content:"";
      position:absolute;
      width:650px;
      height:360px;
      right:12%;
      top:90px;
      background:radial-gradient(
        circle,
        rgba(81,22,255,.24),
        transparent 66%
      );
      filter:blur(12px);
      pointer-events:none;
    }

    .hero-grid{
      display:grid;
      grid-template-columns:40% 60%;
      align-items:center;
      min-height:590px;
      position:relative;
      z-index:1;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border:1px solid rgba(143,82,255,.35);
      border-radius:9px;
      background:rgba(87,37,160,.08);
      font-size:12px;
      margin-bottom:18px;
      box-shadow:0 0 20px rgba(125,44,255,.12);
    }

    .eyebrow span{
      color:#bd7cff;
    }

    .hero h1{
      font-size:clamp(42px,5vw,67px);
      line-height:.98;
      letter-spacing:-3px;
      max-width:510px;
    }

    .gradient{
      background:linear-gradient(
        100deg,
        #fff 0%,
        #fff 25%,
        #c144ff 55%,
        #257bff 92%
      );
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .hero p{
      color:#c4c6d2;
      line-height:1.7;
      max-width:470px;
      margin:22px 0 27px;
      font-size:15px;
    }

    .actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    .secondary{
      padding:12px 18px;
      border-radius:10px;
      border:1px solid rgba(160,150,255,.23);
      background:rgba(10,10,22,.7);
      font-weight:700;
      transition:.2s;
    }

    .secondary:hover{
      background:rgba(70,55,110,.22);
      border-color:rgba(170,140,255,.5);
    }

    .trust{
      display:flex;
      gap:28px;
      margin-top:28px;
      flex-wrap:wrap;
      color:#d2d2df;
      font-size:12px;
    }

    .trust span{
      display:flex;
      align-items:center;
      gap:7px;
    }

    .trust b{
      font-size:17px;
      color:#a94bff;
    }

    /* MOCKUP */

    .hero-art{
      height:530px;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .glow{
      position:absolute;
      width:500px;
      height:300px;
      border-radius:50%;
      background:radial-gradient(
        circle,
        rgba(83,25,255,.3),
        transparent 66%
      );
      filter:blur(8px);
    }

    .app-window{
      position:absolute;
      width:min(600px,92%);
      height:365px;
      right:3%;
      top:78px;
      border:1px solid rgba(104,119,255,.85);
      border-radius:16px;
      background:linear-gradient(
        145deg,
        rgba(12,13,28,.96),
        rgba(5,6,15,.98)
      );
      box-shadow:
        0 0 28px rgba(47,87,255,.3),
        0 0 60px rgba(184,29,255,.17);
      overflow:hidden;
      transform:
        perspective(1000px)
        rotateY(-4deg)
        rotateX(2deg);
    }

    .window-head{
      height:48px;
      border-bottom:1px solid rgba(150,150,255,.12);
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 15px;
      font-size:12px;
    }

    .window-logo{
      width:23px;
      height:23px;
      border-radius:7px;
      background:linear-gradient(135deg,#a532ff,#157fff);
      display:grid;
      place-items:center;
      font-weight:900;
    }

    .app-body{
      display:grid;
      grid-template-columns:55px 150px 1fr;
      height:calc(100% - 48px);
    }

    .rail{
      border-right:1px solid rgba(150,150,255,.1);
      display:flex;
      align-items:center;
      flex-direction:column;
      padding-top:15px;
      gap:13px;
    }

    .rail i{
      width:29px;
      height:29px;
      border-radius:9px;
      border:1px solid rgba(130,130,255,.13);
      display:grid;
      place-items:center;
      color:#9c9eae;
      font-style:normal;
    }

    .rail i:first-child{
      background:linear-gradient(135deg,#7536ff,#167cff);
      color:#fff;
    }

    .channels{
      padding:17px 12px;
      border-right:1px solid rgba(150,150,255,.1);
      font-size:10px;
      color:#777b91;
    }

    .channels strong{
      display:block;
      color:#c7c9d7;
      font-size:11px;
      margin-bottom:16px;
    }

    .channel{
      padding:7px 8px;
      border-radius:6px;
      margin:3px 0;
    }

    .channel.sel{
      background:rgba(100,77,180,.18);
      color:#fff;
    }

    .chat{
      display:flex;
      flex-direction:column;
      min-width:0;
    }

    .chat-head{
      padding:17px 15px;
      border-bottom:1px solid rgba(150,150,255,.1);
      font-weight:700;
      font-size:13px;
    }

    .messages{
      padding:15px;
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .msg{
      display:flex;
      gap:10px;
      font-size:11px;
      color:#d6d8e3;
    }

    .avatar{
      width:25px;
      height:25px;
      flex:0 0 25px;
      border-radius:50%;
      background:linear-gradient(135deg,#8738ff,#0c94ff);
    }

    .msg small{
      color:#70758d;
    }

    .composer{
      margin:auto 13px 12px;
      border:1px solid rgba(150,150,255,.14);
      border-radius:8px;
      padding:9px;
      color:#65697d;
      font-size:10px;
    }

    .mascot{
      position:absolute;
      width:270px;
      height:270px;
      object-fit:cover;
      border-radius:50%;
      left:2%;
      bottom:4px;
      filter:drop-shadow(
        0 12px 30px rgba(105,37,255,.45)
      );
      z-index:4;
      animation:float 5s ease-in-out infinite;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0);
      }

      50%{
        transform:translateY(-9px);
      }
    }

    /* SOBRE */

    .about{
      padding:65px 0;
    }

    .about-grid{
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:45px;
      align-items:center;
    }

    .kicker{
      font-size:11px;
      letter-spacing:1.5px;
      color:#b96cff;
      font-weight:800;
      text-transform:uppercase;
    }

    .title{
      font-size:31px;
      letter-spacing:-1px;
      margin:10px 0 12px;
    }

    .copy{
      color:#aeb1c1;
      line-height:1.75;
      font-size:14px;
      max-width:600px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
      margin-top:25px;
    }

    .mini{
      border:1px solid rgba(145,130,255,.18);
      background:linear-gradient(
        180deg,
        rgba(17,17,32,.75),
        rgba(6,7,15,.82)
      );
      padding:17px 13px;
      border-radius:10px;
      min-height:115px;
      transition:.2s;
    }

    .mini:hover{
      transform:translateY(-3px);
      border-color:rgba(158,80,255,.5);
      box-shadow:0 0 25px rgba(100,42,255,.12);
    }

    .mini .ico{
      font-size:22px;
      color:#9c55ff;
    }

    .mini h3{
      font-size:13px;
      margin:10px 0 5px;
    }

    .mini p{
      font-size:10px;
      color:#8f93a5;
      line-height:1.5;
    }

    .about-art{
      min-height:300px;
      display:grid;
      place-items:center;
      position:relative;
    }

    .logo-card{
      width:300px;
      height:235px;
      border:1px solid rgba(100,132,255,.45);
      border-radius:22px;
      background:linear-gradient(
        145deg,
        rgba(16,12,37,.92),
        rgba(5,7,18,.92)
      );
      box-shadow:0 0 35px rgba(92,37,255,.22);
      display:grid;
      place-items:center;
      position:relative;
      transform:perspective(800px) rotateY(-7deg);
    }

    .logo-card img{
      width:210px;
      max-height:125px;
      object-fit:contain;
    }

    .logo-card::before,
    .logo-card::after{
      content:"";
      position:absolute;
      border:1px solid rgba(91,74,255,.3);
      width:55px;
      height:55px;
      border-radius:10px;
    }

    .logo-card::before{
      left:-48px;
      top:50px;
    }

    .logo-card::after{
      right:-48px;
      top:85px;
    }

    /* RECURSOS */

    .features{
      padding:65px 0;
    }

    .center{
      text-align:center;
    }

    .center .copy{
      margin:0 auto;
    }

    .feature-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-top:32px;
    }

    .feature{
      padding:26px;
      border:1px solid rgba(145,130,255,.17);
      border-radius:12px;
      background:linear-gradient(
        160deg,
        rgba(15,14,31,.78),
        rgba(5,6,14,.9)
      );
      min-height:175px;
      transition:.25s;
    }

    .feature:hover{
      transform:translateY(-4px);
      border-color:rgba(178,71,255,.5);
      box-shadow:0 0 28px rgba(105,35,255,.15);
    }

    .feature .bigico{
      font-size:30px;
      filter:drop-shadow(
        0 0 9px rgba(169,65,255,.7)
      );
    }

    .feature h3{
      font-size:14px;
      margin:15px 0 7px;
    }

    .feature p{
      font-size:11px;
      line-height:1.6;
      color:#989bad;
    }

    /* DOWNLOAD */

    .download{
      padding:65px 0;
    }

    .platforms{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin:32px 0 13px;
    }

    .platform{
      border:1px solid rgba(145,130,255,.18);
      border-radius:11px;
      padding:18px;
      background:rgba(10,10,20,.75);
      display:flex;
      align-items:center;
      gap:14px;
    }

    .platform .picon{
      font-size:30px;
    }

    .platform h3{
      font-size:14px;
    }

    .platform p{
      font-size:10px;
      color:#8f93a4;
      margin-top:3px;
    }

    .platform button{
      margin-left:auto;
      padding:8px 12px;
      border:1px solid rgba(150,140,255,.25);
      border-radius:8px;
      background:linear-gradient(
        135deg,
        #7528ff,
        #116fff
      );
      color:#fff;
      font-weight:750;
      cursor:pointer;
    }

    .soon button{
      background:transparent;
      color:#b7b9c9;
      box-shadow:none;
      cursor:default;
    }

    .ios{
      border:1px solid rgba(200,71,255,.45);
      box-shadow:0 0 25px rgba(190,42,255,.12);
      padding:18px 25px;
      border-radius:12px;
      display:flex;
      align-items:center;
      gap:16px;
      max-width:720px;
      margin:auto;
    }

    .ios .picon{
      font-size:32px;
    }

    .ios strong{
      font-size:14px;
    }

    .ios span{
      display:block;
      color:#8e92a4;
      font-size:11px;
      margin-top:3px;
    }

    /* CONTATO */

    .contact{
      padding:65px 0;
    }

    .socials{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
      margin-top:30px;
    }

    .social{
      padding:17px;
      border:1px solid rgba(145,130,255,.17);
      background:rgba(9,9,19,.78);
      border-radius:10px;
      display:flex;
      align-items:center;
      gap:12px;
      transition:.2s;
    }

    .social:hover{
      transform:translateY(-3px);
      border-color:rgba(164,76,255,.5);
      box-shadow:0 0 25px rgba(115,40,255,.12);
    }

    .social > div:first-child{
      font-size:24px;
    }

    .social b{
      font-size:13px;
    }

    .social small{
      display:block;
      color:#85899b;
      margin-top:3px;
      font-size:10px;
    }

    /* FOOTER */

    footer{
      padding:45px 0;
    }

    .footer-grid{
      display:grid;
      grid-template-columns:2fr 1fr 1fr 1fr;
      gap:35px;
    }

    .footer-brand img{
      width:155px;
      margin-bottom:13px;
    }

    .footer-brand p{
      color:#c0c2cf;
      font-size:13px;
    }

    .copyright{
      margin-top:18px;
      color:#686b7d;
      font-size:11px;
    }

    .footer-col{
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    .footer-col h4{
      font-size:12px;
      margin-bottom:4px;
      color:#ddd;
    }

    .footer-col a{
      font-size:11px;
      color:#888b9d;
      transition:.2s;
    }

    .footer-col a:hover{
      color:#b76aff;
    }

    /* TOAST */

    .toast{
      position:fixed;
      left:50%;
      bottom:25px;
      transform:translate(-50%,20px);
      background:rgba(12,11,25,.96);
      border:1px solid rgba(158,83,255,.45);
      box-shadow:0 0 30px rgba(105,35,255,.25);
      padding:13px 20px;
      border-radius:10px;
      color:#fff;
      font-size:13px;
      opacity:0;
      pointer-events:none;
      transition:.3s;
      z-index:100;
      text-align:center;
    }

    .toast.show{
      transform:translate(-50%,0);
      opacity:1;
    }

    /* RESPONSIVO */

    @media(max-width:900px){

      .links,
      .header-btn{
        display:none;
      }

      .menu{
        display:block;
      }

      .hero-grid,
      .about-grid{
        grid-template-columns:1fr;
      }

      .hero{
        padding:40px 0 10px;
      }

      .hero-art{
        height:480px;
      }

      .app-window{
        right:0;
        width:92%;
        top:45px;
      }

      .mascot{
        width:210px;
        height:210px;
        left:2%;
        bottom:25px;
      }

      .feature-grid{
        grid-template-columns:repeat(2,1fr);
      }

      .footer-grid{
        grid-template-columns:1fr 1fr;
      }

      .cards{
        grid-template-columns:repeat(2,1fr);
      }

      .platforms,
      .socials{
        grid-template-columns:1fr;
      }

      .about-art{
        margin-top:15px;
      }
    }

    @media(max-width:560px){

      .container{
        width:min(100% - 28px,1180px);
      }

      .topbar{
        height:68px;
      }

      .brand img{
        width:142px;
      }

      .hero h1{
        font-size:44px;
        letter-spacing:-2px;
      }

      .hero p{
        font-size:13px;
      }

      .hero-art{
        height:390px;
      }

      .app-window{
        height:270px;
        top:35px;
      }

      .app-body{
        grid-template-columns:42px 105px 1fr;
      }

      .channels{
        font-size:8px;
      }

      .messages{
        padding:9px;
        gap:9px;
      }

      .msg{
        font-size:9px;
      }

      .composer{
        font-size:8px;
      }

      .mascot{
        width:150px;
        height:150px;
        bottom:4px;
        left:-3%;
      }

      .feature-grid{
        grid-template-columns:1fr;
      }

      .cards{
        grid-template-columns:1fr 1fr;
      }

      .mini{
        min-height:105px;
        padding:13px 10px;
      }

      .title{
        font-size:27px;
      }

      .logo-card{
        width:250px;
        height:195px;
      }

      .logo-card img{
        width:175px;
      }

      .footer-grid{
        grid-template-columns:1fr 1fr;
      }

      .footer-brand{
        grid-column:1/-1;
      }

      .actions a,
      .actions button{
        width:100%;
        text-align:center;
      }

      .trust{
        gap:13px;
      }

      .trust span{
        font-size:10px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->

  <header class="topbar">
    <div class="container nav">

      <a class="brand" href="#inicio" aria-label="VoxCord">
        <img src="assets/logo-horizontal.png" alt="VoxCord">
      </a>

      <nav class="links" aria-label="Navegação">
        <a class="active" href="#inicio">Início</a>
        <a href="#recursos">Recursos</a>
        <a href="#sobre">Sobre</a>
        <a href="#download">Download</a>
        <a href="#contato">Contato</a>
      </nav>

      <a class="header-btn" href="#download">
        ⇩ &nbsp; Baixar Agora
      </a>

      <button class="menu" id="menuBtn" aria-label="Abrir menu">
        ☰
      </button>

    </div>
  </header>


  <main>

    <!-- HERO -->

    <section class="hero" id="inicio">

      <div class="container hero-grid">

        <div>

          <div class="eyebrow">
            ✦
            <span>Seu espaço. Suas pessoas.</span>
          </div>

          <h1>
            Fale.
            <span class="gradient">Conecte.</span>
            <br>
            Viva o
            <span class="gradient">VoxCord.</span>
          </h1>

          <p>
            O VoxCord é mais que um chat. É onde comunidades se unem,
            amizades acontecem e momentos são compartilhados em tempo real.
          </p>

          <div class="actions">

            <button class="primary download-btn">
              ⇩ &nbsp; Baixar VoxCord
            </button>

            <a class="secondary" href="#sobre">
              Conhecer mais
